<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MCP Debugger{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="/static/style.css">

    <style>
        body { background-color: #1a1b26; color: #a9b1d6; }
        .bg-panel   { background-color: #24283b; }
        .border-panel { border-color: #414868; }
        .text-accent  { color: #7aa2f7; }
        th { background-color: #1f2335; color: #c0caf5; }
        tr { border-bottom: 1px solid #292e42; }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="bg-panel border-b border-panel py-3 px-6 flex justify-between items-center sticky top-0 z-10 shadow-lg">
        <a href="/" class="flex items-center gap-3 no-underline">
            <svg class="w-7 h-7 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
            </svg>
            <span class="text-lg font-bold tracking-wider text-white">
                MCP<span class="text-accent font-light">DEBUGGER</span>
            </span>
        </a>
        <nav>
            <ul class="flex items-center space-x-5 text-sm font-medium">
                <li><a href="/" class="hover:text-white transition-colors duration-150">📊 Sessions</a></li>
                <li><a href="/docs" class="hover:text-white transition-colors duration-150 text-gray-500">📖 API Docs</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-6">
        <div class="max-w-7xl mx-auto">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-panel border-t border-panel py-3 px-6 text-center text-xs text-gray-600">
        mcp-debugger &bull; Model Context Protocol Debugging Proxy &bull;
        <a href="https://github.com/sushant-mutnale/mcp-debugger" class="hover:text-gray-400 transition-colors">GitHub</a>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
